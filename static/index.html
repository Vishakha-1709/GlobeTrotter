<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobeTrotter — Empowering Personalized Travel Planning</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            odoo: {
              purple: '#714B67',
              darkPurple: '#53364c',
              teal: '#017E84',
              darkTeal: '#005f63',
              amber: '#E99834',
              bg: '#F8FAFC'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js for Budget Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React & Babel for zero-build-step standalone execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    #map-container { min-height: 420px; border-radius: 1rem; z-index: 10; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-purple-100 selection:text-odoo-purple">
  <div id="root"></div>

  <!-- Main React App Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = "http://localhost:8000/api";

    function App() {
      // User authentication state (Screen 1)
      const [currentUser, setCurrentUser] = useState(null); // null = show Screen 1 Login/Signup
      
      // Navigation state: 'dashboard' | 'trips' | 'trip-detail' | 'explore' | 'admin' | 'profile'
      const [currentView, setCurrentView] = useState('dashboard');
      const [selectedTripId, setSelectedTripId] = useState(1);
      const [tripData, setTripData] = useState(null);
      const [userTrips, setUserTrips] = useState([]);
      const [cities, setCities] = useState([]);
      const [adminStats, setAdminStats] = useState(null);
      const [loading, setLoading] = useState(false);
      const [notification, setNotification] = useState(null);

      // Modals
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [showAddStopModal, setShowAddStopModal] = useState(false);
      const [showAddActivityModal, setShowAddActivityModal] = useState(false);
      const [showAddExpenseModal, setShowAddExpenseModal] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);
      const [tripToShare, setTripToShare] = useState(null);
      const [editingExpense, setEditingExpense] = useState(null);
      const [selectedStopForActivity, setSelectedStopForActivity] = useState(null);

      // WOW Factor States
      const [activeTripTab, setActiveTripTab] = useState('itinerary'); // 'itinerary' | 'budget'
      const [optimizationResult, setOptimizationResult] = useState(null);
      const [globeSplitReport, setGlobeSplitReport] = useState(null);

      // Toast notification helper
      const showToast = (msg, type = "success") => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      // Load initial data
      useEffect(() => {
        if (currentUser) {
          fetchUserTrips();
          fetchCities();
        }
      }, [currentUser]);

      const handleLoginSuccess = (user) => {
        setCurrentUser(user);
        setCurrentView('dashboard');
        showToast(`Welcome back, ${user.name}!`);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        showToast("Logged out successfully.");
      };

      // Reload icons when DOM changes
      useEffect(() => {
        if (window.lucide) {
          setTimeout(() => window.lucide.createIcons(), 50);
        }
      }, [currentView, tripData, activeTripTab, userTrips, cities]);

      const fetchUserTrips = async () => {
        try {
          const res = await fetch(`${API_BASE}/trips`);
          if (res.ok) {
            const data = await res.json();
            setUserTrips(data);
          }
        } catch (e) {
          console.error("Error fetching trips:", e);
        }
      };

      const fetchCities = async (query = "") => {
        try {
          const url = query ? `${API_BASE}/cities/search?query=${encodeURIComponent(query)}` : `${API_BASE}/cities/search`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            setCities(data);
          }
        } catch (e) {
          console.error("Error fetching cities:", e);
        }
      };

      const loadTripDetail = async (id) => {
        try {
          const res = await fetch(`${API_BASE}/trips/${id}`);
          if (res.ok) {
            const data = await res.json();
            setTripData(data);
            setSelectedTripId(id);
            setCurrentView('trip-detail');
            await loadGlobeSplit(id);
          }
        } catch (e) {
          showToast("Failed to load trip details", "error");
        }
      };

      const loadGlobeSplit = async (tripId) => {
        try {
          const res = await fetch(`${API_BASE}/trips/${tripId}/globesplit`);
          if (res.ok) {
            const data = await res.json();
            setGlobeSplitReport(data);
          }
        } catch (e) {
          console.error("Error loading GlobeSplit:", e);
        }
      };

      const loadAdminStats = async () => {
        try {
          const res = await fetch(`${API_BASE}/admin/analytics`);
          if (res.ok) {
            const data = await res.json();
            setAdminStats(data);
            setCurrentView('admin');
          }
        } catch (e) {
          showToast("Failed to load admin analytics", "error");
        }
      };

      // WOW FACTOR 2: Trigger TSP Route Optimization
      const handleOptimizeDay = async (stopId, dayNumber) => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/stops/${stopId}/optimize-day/${dayNumber}`, { method: 'POST' });
          const result = await res.json();
          if (res.ok) {
            setOptimizationResult(result);
            showToast(`✨ Smart Optimized Day ${dayNumber}! Saved ${result.distance_saved_km} km & ${result.time_saved_minutes} mins transit!`, 'success');
            // Reload updated trip items
            loadTripDetail(selectedTripId);
          } else {
            showToast(result.detail || "Please add at least 2 activities first to run Smart Route Optimization!", "error");
          }
        } catch (e) {
          showToast("Please add at least 2 activities first to optimize route!", "error");
        } finally {
          setLoading(false);
        }
      };

      // 1-Click Clone / Fork Trip
      const handleCloneTrip = async (tripId) => {
        try {
          const res = await fetch(`${API_BASE}/trips/${tripId}/clone`, { method: 'POST' });
          if (res.ok) {
            const newTrip = await res.json();
            showToast(`🎉 Cloned "${newTrip.title}" into your account!`, 'success');
            fetchUserTrips();
            loadTripDetail(newTrip.id);
          }
        } catch (e) {
          showToast("Failed to clone trip", "error");
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Toast Notification */}
          {notification && (
            <div className={`fixed top-4 right-4 z-50 px-5 py-3 rounded-xl shadow-2xl text-white font-medium flex items-center gap-3 transition-all transform animate-bounce ${
              notification.type === 'error' ? 'bg-red-600' : 'bg-odoo-teal'
            }`}>
              <i data-lucide={notification.type === 'error' ? 'alert-circle' : 'sparkles'} className="w-5 h-5"></i>
              <span>{notification.msg}</span>
            </div>
          )}

          {/* If user is not logged in, show Screen 1: Login / Signup */}
          {!currentUser ? (
            <AuthView onLoginSuccess={handleLoginSuccess} />
          ) : (
            <>
              {/* Navigation Bar */}
              <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                  <div className="flex items-center gap-8">
                    <div 
                      onClick={() => setCurrentView('dashboard')}
                      className="flex items-center gap-2 cursor-pointer group"
                    >
                      <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-odoo-purple to-odoo-teal flex items-center justify-center text-white shadow-md group-hover:scale-105 transition-transform">
                        <i data-lucide="compass" className="w-6 h-6"></i>
                      </div>
                      <div>
                        <span className="text-xl font-extrabold tracking-tight text-odoo-purple">Globe<span className="text-odoo-teal">Trotter</span></span>
                        <span className="hidden sm:inline-block text-xs bg-purple-100 text-odoo-purple font-semibold ml-2 px-2 py-0.5 rounded-full">Odoo Edition</span>
                      </div>
                    </div>

                    {/* Nav Links */}
                    <nav className="hidden md:flex items-center gap-1">
                      <button 
                        onClick={() => setCurrentView('dashboard')}
                        className={`px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition-colors ${
                          currentView === 'dashboard' ? 'bg-purple-50 text-odoo-purple' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'
                        }`}
                      >
                        <i data-lucide="layout-dashboard" className="w-4 h-4"></i> Dashboard
                      </button>
                      <button 
                        onClick={() => { setCurrentView('trips'); fetchUserTrips(); }}
                        className={`px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition-colors ${
                          currentView === 'trips' ? 'bg-purple-50 text-odoo-purple' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'
                        }`}
                      >
                        <i data-lucide="plane" className="w-4 h-4"></i> My Trips
                      </button>
                      <button 
                        onClick={() => setCurrentView('explore')}
                        className={`px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition-colors ${
                          currentView === 'explore' ? 'bg-purple-50 text-odoo-purple' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'
                        }`}
                      >
                        <i data-lucide="map-pin" className="w-4 h-4"></i> Explore Cities
                      </button>
                      <button 
                        onClick={loadAdminStats}
                        className={`px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition-colors ${
                          currentView === 'admin' ? 'bg-purple-50 text-odoo-purple' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'
                        }`}
                      >
                        <i data-lucide="bar-chart-3" className="w-4 h-4"></i> Admin Analytics
                      </button>
                    </nav>
                  </div>

                  {/* Quick Actions & User Profile */}
                  <div className="flex items-center gap-3">
                    <button 
                      onClick={() => setShowCreateModal(true)}
                      className="bg-gradient-to-r from-odoo-purple to-odoo-darkPurple hover:opacity-95 text-white font-medium text-sm px-4 py-2 rounded-xl shadow-sm flex items-center gap-1.5 transition-all hover:shadow"
                    >
                      <i data-lucide="plus-circle" className="w-4 h-4"></i>
                      <span className="hidden sm:inline">Plan New Trip</span>
                    </button>
                    
                    <div 
                      onClick={() => setCurrentView('profile')}
                      className="flex items-center gap-2 pl-2 border-l border-slate-200 cursor-pointer"
                    >
                      <img 
                        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" 
                        alt="User" 
                        className="w-9 h-9 rounded-full object-cover border-2 border-odoo-teal"
                      />
                      <span className="hidden lg:inline text-xs font-bold text-slate-700">{currentUser.name}</span>
                    </div>

                    <button 
                      onClick={handleLogout}
                      title="Log Out"
                      className="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-colors"
                    >
                      <i data-lucide="log-out" className="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              </header>

              {/* Main Content View Switcher */}
              <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                {currentView === 'dashboard' && (
                  <DashboardView 
                    user={currentUser}
                    userTrips={userTrips} 
                    cities={cities} 
                    onSelectTrip={loadTripDetail}
                    onPlanTrip={() => setShowCreateModal(true)}
                    onExplore={() => setCurrentView('explore')}
                  />
                )}

            {currentView === 'trips' && (
              <MyTripsView 
                trips={userTrips} 
                onSelectTrip={loadTripDetail} 
                onNewTrip={() => setShowCreateModal(true)}
                onCloneTrip={handleCloneTrip}
              />
            )}

            {currentView === 'explore' && (
              <ExploreCitiesView 
                cities={cities} 
                onSearch={fetchCities}
                onAddCityToTrip={(city) => {
                  showToast(`Selected ${city.name}! Choose a trip to add this city.`);
                  setCurrentView('trips');
                }}
              />
            )}

            {currentView === 'trip-detail' && tripData && (
              <TripWorkspaceView 
                trip={tripData}
                activeTab={activeTripTab}
                setActiveTab={setActiveTripTab}
                onOptimizeDay={handleOptimizeDay}
                optimizationResult={optimizationResult}
                globeSplitReport={globeSplitReport}
                onAddStopClick={() => setShowAddStopModal(true)}
                onAddActivityClick={(stop) => {
                  setSelectedStopForActivity(stop);
                  setShowAddActivityModal(true);
                }}
                onAddExpenseClick={() => {
                  setEditingExpense(null);
                  setShowAddExpenseModal(true);
                }}
                onEditExpenseClick={(exp) => {
                  setEditingExpense(exp);
                  setShowAddExpenseModal(true);
                }}
                onShareClick={(trip) => {
                  setTripToShare(trip);
                  setShowShareModal(true);
                }}
                onCloneTrip={() => handleCloneTrip(tripData.id)}
                onRefresh={() => loadTripDetail(tripData.id)}
              />
            )}

            {currentView === 'admin' && adminStats && (
              <AdminAnalyticsView stats={adminStats} />
            )}

            {currentView === 'profile' && (
              <UserProfileView user={currentUser} />
            )}
          </main>

          {/* Create Trip Modal */}
          {showCreateModal && (
            <CreateTripModal 
              onClose={() => setShowCreateModal(false)}
              onCreated={(newTrip) => {
                setShowCreateModal(false);
                fetchUserTrips();
                loadTripDetail(newTrip.id);
                showToast("🎉 Trip created successfully!");
              }}
            />
          )}

          {/* Add City Stop Modal (Screen 5) */}
          {showAddStopModal && tripData && (
            <AddStopModal 
              trip={tripData}
              cities={cities}
              onClose={() => setShowAddStopModal(false)}
              onAdded={() => {
                setShowAddStopModal(false);
                loadTripDetail(tripData.id);
                showToast("🎉 Destination city stop added to trip!");
              }}
            />
          )}

          {/* Add Activity Modal */}
          {showAddActivityModal && selectedStopForActivity && (
            <AddActivityModal 
              stop={selectedStopForActivity}
              onClose={() => setShowAddActivityModal(false)}
              onAdded={() => {
                setShowAddActivityModal(false);
                loadTripDetail(selectedTripId);
                showToast("Activity added to itinerary!");
              }}
            />
          )}

          {/* Add / Edit Expense Modal */}
          {showAddExpenseModal && tripData && (
            <AddExpenseModal 
              trip={tripData}
              initialExpense={editingExpense}
              onNavigateToMembers={() => {
                setShowAddExpenseModal(false);
                setEditingExpense(null);
                setActiveTripTab('budget');
                showToast("Switched to Budget & GlobeSplit! Add travelers in the group section.");
              }}
              onClose={() => {
                setShowAddExpenseModal(false);
                setEditingExpense(null);
              }}
              onAdded={() => {
                setShowAddExpenseModal(false);
                setEditingExpense(null);
                loadTripDetail(tripData.id);
                showToast(editingExpense ? "Expense updated successfully!" : "Expense recorded & GlobeSplit updated!");
              }}
            />
          )}

          {/* Share Itinerary Modal */}
          {showShareModal && tripToShare && (
            <ShareItineraryModal 
              trip={tripToShare}
              onClose={() => {
                setShowShareModal(false);
                setTripToShare(null);
              }}
            />
          )}
          </>
          )}
        </div>
      );
    }

    // =========================================================================
    // SCREEN 1: LOGIN / SIGNUP SCREEN (Problem Statement Requirement #1)
    // =========================================================================
    function AuthView({ onLoginSuccess }) {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [name, setName] = useState("");
      const [currency, setCurrency] = useState("INR");
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);
        setLoading(true);

        try {
          if (isLogin) {
            const res = await fetch(`${API_BASE}/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "Invalid email or password");
            onLoginSuccess(data.user);
          } else {
            const res = await fetch(`${API_BASE}/auth/signup`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, email, password, base_currency: currency })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "Registration failed");
            onLoginSuccess(data.user);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-odoo-darkPurple to-slate-900 relative overflow-hidden">
          {/* Ambient Glows */}
          <div className="absolute -top-20 -left-20 w-96 h-96 bg-odoo-purple/30 rounded-full blur-3xl"></div>
          <div className="absolute -bottom-20 -right-20 w-96 h-96 bg-odoo-teal/20 rounded-full blur-3xl"></div>

          <div className="relative z-10 max-w-md w-full bg-white/95 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/20 space-y-6">
            {/* Header Brand */}
            <div className="text-center space-y-2">
              <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-odoo-purple to-odoo-teal mx-auto flex items-center justify-center text-white shadow-lg">
                <i data-lucide="compass" className="w-8 h-8"></i>
              </div>
              <h1 className="text-2xl font-extrabold tracking-tight text-slate-900">
                Globe<span className="text-odoo-teal">Trotter</span>
              </h1>
              <p className="text-xs text-slate-500 font-medium">
                Empowering Personalized Multi-City Travel Planning
              </p>
            </div>

            {/* Tab Toggle: Login vs Signup */}
            <div className="flex bg-slate-100 p-1 rounded-2xl">
              <button
                type="button"
                onClick={() => { setIsLogin(true); setError(null); setEmail(""); setPassword(""); }}
                className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${
                  isLogin ? 'bg-white text-odoo-purple shadow-sm' : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                Log In
              </button>
              <button
                type="button"
                onClick={() => { setIsLogin(false); setError(null); setEmail(""); setPassword(""); setName(""); }}
                className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${
                  !isLogin ? 'bg-white text-odoo-purple shadow-sm' : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                Sign Up
              </button>
            </div>

            {/* Error Message */}
            {error && (
              <div className="p-3.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl flex items-center justify-between gap-2 shadow-sm">
                <div className="flex items-center gap-2">
                  <i data-lucide="alert-circle" className="w-4 h-4 shrink-0 text-rose-600"></i>
                  <span>{error}</span>
                </div>
                {isLogin && error.includes("sign up") && (
                  <button
                    type="button"
                    onClick={() => {
                      setIsLogin(false);
                      setError(null);
                    }}
                    className="text-[11px] font-bold text-odoo-purple underline hover:text-odoo-darkPurple shrink-0 cursor-pointer ml-1"
                  >
                    Sign Up Now →
                  </button>
                )}
              </div>
            )}

            {/* Auth Form */}
            <form onSubmit={handleSubmit} className="space-y-4">
              {!isLogin && (
                <div>
                  <label className="text-xs font-bold text-slate-700">Full Name</label>
                  <input
                    type="text"
                    required
                    placeholder="Enter your full name"
                    value={name}
                    onChange={e => setName(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-odoo-purple outline-none"
                  />
                </div>
              )}

              <div>
                <label className="text-xs font-bold text-slate-700">Email Address</label>
                <input
                  type="email"
                  required
                  placeholder="Enter your email address"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-odoo-purple outline-none"
                />
              </div>

              <div>
                <div className="flex items-center justify-between">
                  <label className="text-xs font-bold text-slate-700">Password</label>
                  {isLogin && (
                    <button
                      type="button"
                      onClick={() => alert("Password reset link sent to your email address.")}
                      className="text-[11px] font-semibold text-odoo-teal hover:underline"
                    >
                      Forgot Password?
                    </button>
                  )}
                </div>
                <input
                  type="password"
                  required
                  placeholder="Enter your password"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-odoo-purple outline-none"
                />
              </div>

              {!isLogin && (
                <div>
                  <label className="text-xs font-bold text-slate-700">Base Currency</label>
                  <select
                    value={currency}
                    onChange={e => setCurrency(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold"
                  >
                    <option value="INR">INR (₹) - Indian Rupee</option>
                    <option value="USD">USD ($) - US Dollar</option>
                    <option value="EUR">EUR (€) - Euro</option>
                    <option value="GBP">GBP (£) - British Pound</option>
                  </select>
                </div>
              )}

              <button
                type="submit"
                disabled={loading}
                className="w-full bg-odoo-purple hover:bg-odoo-darkPurple text-white py-3.5 rounded-xl font-bold text-sm shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer"
              >
                {loading ? "Processing..." : isLogin ? "Log In to My Trips →" : "Create Account & Start Exploring →"}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 1. DASHBOARD VIEW (Screen 2)
    // =========================================================================

    function TripWorkspaceView({ 
      trip, 
      activeTab, 
      setActiveTab, 
      onOptimizeDay, 
      optimizationResult, 
      globeSplitReport,
      onAddStopClick,
      onAddActivityClick,
      onAddExpenseClick,
      onEditExpenseClick,
      onShareClick,
      onCloneTrip,
      onRefresh
    }) {
      const [newMemberName, setNewMemberName] = useState("");
      const [newMemberRole, setNewMemberRole] = useState("editor");
      const [isAddingMember, setIsAddingMember] = useState(false);

      const handleAddMember = async (e) => {
        e.preventDefault();
        if (!newMemberName.trim()) return;
        try {
          const res = await fetch(`${API_BASE}/trips/${trip.id}/members`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ guest_name: newMemberName.trim(), role: newMemberRole })
          });
          if (res.ok) {
            setNewMemberName("");
            setIsAddingMember(false);
            onRefresh();
          } else {
            alert("Failed to add member");
          }
        } catch (err) {
          alert("Error adding member");
        }
      };

      const handleRemoveMember = async (memberId) => {
        if (!confirm("Remove this traveler from the group?")) return;
        try {
          const res = await fetch(`${API_BASE}/trips/${trip.id}/members/${memberId}`, {
            method: 'DELETE'
          });
          if (res.ok) onRefresh();
        } catch (err) {
          alert("Error removing member");
        }
      };

      const handleDeleteExpense = async (expenseId) => {
        if (!confirm("Are you sure you want to delete this expense?")) return;
        try {
          const res = await fetch(`${API_BASE}/trips/${trip.id}/expenses/${expenseId}`, {
            method: 'DELETE'
          });
          if (res.ok) {
            onRefresh();
          } else {
            alert("Failed to delete expense");
          }
        } catch (err) {
          alert("Error deleting expense");
        }
      };

      return (
        <div className="space-y-6">
          {/* Trip Header Card */}
          <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <span className="px-3 py-1 bg-purple-100 text-odoo-purple rounded-full text-xs font-bold uppercase tracking-wider">
                    {trip.currency} Itinerary
                  </span>
                  <span className="text-xs text-slate-500 font-medium flex items-center gap-1">
                    <i data-lucide="calendar" className="w-3.5 h-3.5"></i> {trip.start_date} → {trip.end_date}

                <button

                <button

                >
                  <i data-lucide="copy" className="w-4 h-4"></i> Fork / Copy Trip

                <button

    // =========================================================================
    // MODALS: Create Trip, Add Activity, Add Expense
    // =========================================================================
    function CreateTripModal({ onClose, onCreated }) {
      const todayStr = new Date().toISOString().split('T')[0];
      const [title, setTitle] = useState("");
      const [desc, setDesc] = useState("");
      const [startDate, setStartDate] = useState(todayStr);
      const [endDate, setEndDate] = useState(todayStr);
      const [budget, setBudget] = useState(50000);

      const handleSubmit = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_BASE}/trips`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title,
              description: desc,
              start_date: startDate,
              end_date: endDate,
              total_budget: parseFloat(budget),
              currency: "INR",
              is_public: true
            })
          });
          if (res.ok) {
            const data = await res.json();
            onCreated(data);
          }
        } catch (err) {
          alert("Error creating trip");
        }
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-6 shadow-2xl">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-xl font-extrabold text-slate-900">Plan a New Journey</h3>
                <p className="text-xs text-slate-500">Create trip container with travel dates & budget.</p>
              </div>
              <button 
                type="button" 
                onClick={onClose} 
                className="w-8 h-8 rounded-full bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-rose-600 flex items-center justify-center font-bold text-sm transition-all"
                title="Close"
              >
                ✕
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-bold text-slate-700">Trip Name</label>
                <input 
                  type="text" 
                  required
                  placeholder="e.g. Autumn in Bengaluru & Coorg" 
                  value={title} 
                  onChange={e => setTitle(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-odoo-purple outline-none"
                />
              </div>

              <div>
                <label className="text-xs font-bold text-slate-700">Trip Description</label>
                <textarea 
                  rows="2"
                  placeholder="What are your goals for this trip?" 
                  value={desc} 
                  onChange={e => setDesc(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-odoo-purple outline-none"
                ></textarea>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-bold text-slate-700">Start Date</label>
                  <input 
                    type="date" 
                    required
                    value={startDate} 
                    onChange={e => setStartDate(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-700">End Date</label>
                  <input 
                    type="date" 
                    required
                    value={endDate} 
                    onChange={e => setEndDate(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                  />
                </div>
              </div>

              <div>
                <label className="text-xs font-bold text-slate-700">Estimated Total Budget (₹ INR)</label>
                <input 
                  type="number" 
                  required
                  value={budget} 
                  onChange={e => setBudget(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                />
              </div>

              <div className="flex items-center gap-3 pt-2">
                <button 
                  type="button" 
                  onClick={onClose}
                  className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3.5 rounded-xl font-bold text-sm transition-all"
                >

                >

    function AddExpenseModal({ trip, initialExpense, onNavigateToMembers, onClose, onAdded }) {
      const isEditing = !!initialExpense;
      const [desc, setDesc] = useState(initialExpense ? initialExpense.description : "");
      const [category, setCategory] = useState(initialExpense ? initialExpense.category : "Meals");
      const [amount, setAmount] = useState(initialExpense ? initialExpense.amount : 0);
      const [curr, setCurr] = useState(initialExpense ? initialExpense.currency : "INR");

      // Dynamic member list from trip
      const memberNames = (trip.members && trip.members.length > 0)
        ? trip.members.map(m => m.guest_name || 'Traveler')
        : ["Traveler"];

      const [paidBy, setPaidBy] = useState(
        (initialExpense && initialExpense.paid_by_name) ? initialExpense.paid_by_name : (memberNames[0] || "Traveler")
      );
      const [selectedSplitMembers, setSelectedSplitMembers] = useState(
        (initialExpense && initialExpense.splits && initialExpense.splits.length > 0)
          ? initialExpense.splits.map(s => s.member_name)
          : memberNames
      );

      const toggleMemberSplit = (name) => {
        if (selectedSplitMembers.includes(name)) {
          if (selectedSplitMembers.length > 1) {
            setSelectedSplitMembers(selectedSplitMembers.filter(m => m !== name));
          }
        } else {
          setSelectedSplitMembers([...selectedSplitMembers, name]);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const parsedAmount = parseFloat(amount) || 0;
        try {
          const splitAmount = roundVal(parsedAmount / (selectedSplitMembers.length || 1));
          const url = isEditing
            ? `${API_BASE}/trips/${trip.id}/expenses/${initialExpense.id}`
            : `${API_BASE}/trips/${trip.id}/expenses`;
          const method = isEditing ? 'PUT' : 'POST';

          const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              description: desc,
              category,
              amount: parsedAmount,
              currency: curr,
              paid_by_name: paidBy,
              expense_date: trip.start_date,
              splits: selectedSplitMembers.map(m => ({ member_name: m, share_amount: splitAmount }))
            })
          });
          if (res.ok) onAdded();
          else alert("Failed to save expense");
        } catch (err) {
          alert("Error saving expense");
        }
      };

      const roundVal = (v) => Math.round(v * 100) / 100;

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-5 shadow-2xl">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-xl font-extrabold text-slate-900">{isEditing ? "Edit Shared Expense" : "Log Multi-Currency Expense"}</h3>
                <p className="text-xs text-slate-500">{isEditing ? "Update bill details and recalculated split." : "Record shared bill with custom group splits."}</p>
              </div>
              <button 
                type="button" 
                onClick={onClose} 
                className="w-8 h-8 rounded-full bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-rose-600 flex items-center justify-center font-bold text-sm transition-all cursor-pointer"
                title="Close"
              >
                ✕
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-bold text-slate-700">Description</label>
                <input 
                  type="text" 
                  required
                  placeholder="e.g. Dinner at Vidyarthi Bhavan, River Rafting..." 
                  value={desc} 
                  onChange={e => setDesc(e.target.value)}
                  className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-odoo-purple"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-bold text-slate-700">Category</label>
                  <select 
                    value={category} 
                    onChange={e => setCategory(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                  >
                    <option value="Stay">Stay</option>
                    <option value="Transport">Transport</option>
                    <option value="Meals">Meals</option>
                    <option value="Activities">Activities</option>
                    <option value="Shopping">Shopping</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-700">Paid By (Who Paid?)</label>
                  <select 
                    value={paidBy} 
                    onChange={e => setPaidBy(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-odoo-purple"
                  >
                    {memberNames.map(name => (
                      <option key={name} value={name}>{name}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-bold text-slate-700">Amount</label>
                  <input 
                    type="number" 
                    required
                    min="0"
                    placeholder="0"
                    value={amount} 
                    onChange={e => setAmount(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-700">Currency (Live FX)</label>
                  <select 
                    value={curr} 
                    onChange={e => setCurr(e.target.value)}
                    className="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold"
                  >
                    <option value="INR">INR (₹)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="USD">USD ($)</option>
                    <option value="JPY">JPY (¥)</option>
                    <option value="GBP">GBP (£)</option>
                  </select>
                </div>
              </div>

              {/* Group Members Split Selector */}
              <div className="space-y-2 pt-1">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-bold text-slate-700">
                    Split Among Travelers ({selectedSplitMembers.length})
                  </label>
                  <div className="flex items-center gap-2">
                    <span className="text-odoo-teal text-[11px] font-bold">
                      ₹{(((parseFloat(amount) || 0)) / (selectedSplitMembers.length || 1)).toFixed(2)} each
                    </span>
                    {onNavigateToMembers && (
                      <button
                        type="button"
                        onClick={onNavigateToMembers}
                        className="text-[11px] font-bold text-odoo-purple hover:underline bg-purple-50 hover:bg-purple-100 px-2 py-0.5 rounded-lg transition-colors cursor-pointer flex items-center gap-1"
                        title="Add more travelers in Budget & GlobeSplit"
                      >
                        <span>+ Add Member</span> ➔
                      </button>
                    )}
                  </div>
                </div>

                <div className="flex flex-wrap gap-2 items-center">
                  {memberNames.map(name => {
                    const isChecked = selectedSplitMembers.includes(name);
                    return (
                      <button
                        key={name}
                        type="button"
                        onClick={() => toggleMemberSplit(name)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer ${
                          isChecked 
                            ? 'bg-purple-100 text-odoo-purple border border-purple-200 shadow-sm' 
                            : 'bg-slate-100 text-slate-400 border border-transparent'
                        }`}
                      >
                        {isChecked ? '✓' : '+'} {name}
                      </button>
                    );
                  })}

                  {onNavigateToMembers && (
                    <button
                      type="button"
                      onClick={onNavigateToMembers}
                      className="px-2.5 py-1.5 rounded-xl text-xs font-semibold text-odoo-purple hover:bg-purple-50 border border-dashed border-purple-300 transition-all flex items-center gap-1 cursor-pointer"
                    >
                      + Add Co-traveler
                    </button>
                  )}
                </div>
              </div>

              <div className="flex items-center gap-3 pt-2">
                <button 
                  type="button" 
                  onClick={onClose}
                  className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold text-sm transition-all"
                >
                  Cancel
                </button>
                <button 
                  type="submit"
                  className="flex-2 bg-odoo-purple hover:bg-odoo-darkPurple text-white py-3 rounded-xl font-bold text-sm shadow-md transition-all flex items-center justify-center gap-1.5"
                >
                  {isEditing ? "Update Expense →" : "Save & Update GlobeSplit →"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Mount React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
